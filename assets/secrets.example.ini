; hardware/secrets.example.ini
; Copy to hardware/secrets.ini and fill in. secrets.ini is gitignored.
; Use only for local bring-up or temporary keys; prefer runtime provisioning for shipped devices.
[secrets]
build_flags =
  -D WIFI_SSID="\"your-ssid\""
  -D WIFI_PASSWORD="\"your-password\""
  -D DEVICE_API_KEY="\"your-dev-key\""
